<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>받아쓰기 용사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style id="app-css">
:root{
  /* 공책 나라: 받아쓰기 칸 공책 위에서 벌어지는 스티커 RPG.
     하늘색 칸(공책) · 빨간 채점 펜(동그라미와 빗금) · 노란 형광펜 · 보라 암호 */
  --paper:#FBFCF8;
  --grid:#89CDE0;
  --grid-soft:#E1F1F6;
  --ink:#22304A;
  --ink-2:#5D6B84;
  --red:#E4473E;
  --yellow:#FFD23F;
  --blue:#2D6BE4;
  --violet:#7350D8;
  --f-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Gaegu","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;font-size:clamp(15px,calc(2.1vmin + 4px),26px)}
body{margin:0;height:100%;overflow:hidden;background-color:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.45;
  background-image:linear-gradient(var(--grid-soft) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid-soft) 1.5px,transparent 1.5px);
  background-size:2.2rem 2.2rem;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;word-break:keep-all;overflow-wrap:anywhere}
#root{height:100%;max-width:58rem;margin:0 auto;position:relative;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
svg{display:block}
h1,h2,h3{text-wrap:balance}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-family:var(--f-display);font-size:1.15rem;line-height:1.15;color:#fff;background:var(--blue);border:3px solid var(--ink);border-radius:14px;padding:.6em 1.1em;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn small{font-size:.72em;opacity:.92}
.btn.big{font-size:1.4rem;padding:.6em 1.5em}
.btn.white{background:#fff;color:var(--ink)}
.btn.red{background:var(--red)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:1.2em;height:1.2em}
.iconbtn{width:2.5rem;height:2.5rem;flex:none;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:0;color:var(--ink)}
.iconbtn svg{width:1.3rem;height:1.3rem}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.linkbtn{background:none;border:0;color:var(--ink-2);font-family:var(--f-display);font-size:.9rem;padding:.45rem .7rem;border-radius:10px}
.hold{position:relative}
.hold.holding::after{content:"";position:absolute;inset:-5px;border-radius:14px;border:3px solid var(--violet);animation:holdfill 1.2s linear forwards}
@keyframes holdfill{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* 공책 장식 */
.tape{display:inline-block;font-family:var(--f-display);font-size:1.15rem;background:rgba(255,210,63,.8);padding:.08em .75em;transform:rotate(-2deg);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.stk{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 3px rgba(34,48,74,.22))}
.pill{display:inline-flex;align-items:center;gap:.25rem;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:.1rem .55rem .1rem .35rem;font-family:var(--f-display);font-size:1rem;line-height:1.25;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.pill b{font-weight:400}
.coin{width:1.1rem;height:1.1rem;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2A8,#F6BE19 60%,#E09B00);border:2px solid #9A6B00;display:inline-block;position:relative}
.coin::after{content:"";position:absolute;inset:22%;border:1.5px solid rgba(154,107,0,.55);border-radius:50%}

/* 윗줄과 아래 메뉴 */
.topbar{display:flex;align-items:center;gap:.45rem;padding:.6rem .8rem .35rem}
.me{display:flex;align-items:center;gap:.45rem;min-width:0;flex:1}
.me .avatar{width:2.6rem;height:2.9rem;flex:none}
.who{display:flex;flex-direction:column;min-width:0}
.who .name{font-family:var(--f-display);font-size:1.08rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:.35rem}
.lv{font-family:var(--f-display);font-weight:400;font-size:.85rem;color:var(--blue)}
.xpbar{width:5.5rem;max-width:20vw;height:.55rem;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--yellow)}
.wallet{display:flex;gap:.3rem}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:.25rem;padding:.35rem .5rem calc(.45rem + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);background:var(--paper)}
.nav button{background:none;border:0;border-radius:12px;padding:.3rem .1rem;display:flex;flex-direction:column;align-items:center;gap:.05rem;font-family:var(--f-display);font-size:.85rem;color:var(--ink-2)}
.nav button svg{width:1.55rem;height:1.55rem}
.nav button.on{color:var(--ink);background:rgba(255,210,63,.6)}
.pagehead{display:flex;justify-content:center;padding:.5rem 1rem .1rem}
.pagehead .tape{font-size:1.35rem}

/* 받아쓰기 칸 */
.sheet{display:flex;flex-wrap:wrap;justify-content:center;--c:44px;padding:1.5px 0 0 1.5px;position:relative;max-width:100%;width:fit-content}
.cell{width:var(--c);height:var(--c);flex:none;margin:-1.5px 0 0 -1.5px;border:1.5px solid var(--grid);background:#fff;display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:calc(var(--c)*.58);line-height:1;color:var(--ink);position:relative}
.cell.pu{place-items:end start;padding:0 0 calc(var(--c)*.1) calc(var(--c)*.22)}
.cell.hole{background:#FFF8D6;box-shadow:inset 0 0 0 3px var(--yellow);color:var(--blue);cursor:pointer}
.cell.hole.cur{box-shadow:inset 0 0 0 3px var(--blue);animation:pulse 1.1s ease-in-out infinite}
.cell.hole.filled{background:#fff;box-shadow:inset 0 0 0 2px var(--grid)}
@keyframes pulse{50%{background:#E3ECFF}}
.cell.code{color:var(--violet);background:#F3EEFF;cursor:pointer}
.cell.code.cur{background:#E6DCFF;box-shadow:inset 0 -4px 0 var(--violet)}
.cell.code.done{color:var(--blue);background:#fff}
.cell.fix{color:var(--red)}
.cell.fix::after{content:"";position:absolute;left:14%;right:14%;bottom:7%;height:3px;border-radius:2px;background:var(--red)}
.cell.sp.fix::after{content:"∨";left:0;right:0;bottom:6%;height:auto;background:none;color:var(--red);font-family:var(--f-display);font-size:calc(var(--c)*.62);line-height:1;text-align:center}

/* 첫 화면 */
.title-scr{align-items:center;gap:1.05rem;padding:1.6rem 1rem;text-align:center}
.title-scr > *{flex:none}
.title-scr::before,.title-scr::after,.create::before,.create::after{content:"";flex:1 1 0}
.logo{display:flex;align-items:center;justify-content:center;margin:0;--c:clamp(2.6rem,12vw,5.2rem);padding:1.5px 0 0 1.5px}
.logo .cell{font-family:var(--f-display);font-weight:400;font-size:calc(var(--c)*.66);animation:write .42s cubic-bezier(.3,1.6,.5,1) both}
.logo-hero{display:flex;position:relative}
@keyframes write{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.ttl-sub{font-family:var(--f-hand);font-size:1.5rem;margin:0;line-height:1.3}
.ttl-cast{display:flex;align-items:flex-end;justify-content:center;gap:.6rem}
.ttl-cast .m1,.ttl-cast .m2{width:clamp(4.2rem,18vw,6rem)}
.ttl-cast .m2{transform:translateY(-.4rem)}
.ttl-cast .hero-big{width:clamp(6rem,26vw,8.5rem);aspect-ratio:100/112}
.ttl-btns{display:flex;flex-direction:column;gap:.9rem;align-items:center}

/* 용사 만들기 */
.create{align-items:center;padding:1.2rem 1rem 2rem;gap:.85rem;text-align:center}
.create > *{flex:none}
.h1{margin:.2rem 0;font-weight:400}
.h1 .tape{font-size:1.6rem}
.cr-preview{width:7.5rem}
.cr-label{font-family:var(--f-display);font-size:1rem;color:var(--ink-2)}
.namein{font-family:var(--f-display);font-size:1.5rem;text-align:center;width:min(15rem,80vw);padding:.3rem .8rem;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;width:min(34rem,100%)}
@media (min-width:640px){.pick{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick button{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:.6rem .4rem .5rem;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.pick .art{width:4.4rem}
.pick b{font-family:var(--f-display);font-weight:400;font-size:1.02rem}
.pick button.on{background:#FFF4C2;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--yellow)}

/* 모험 지도 */
.map{flex:1;min-height:0;overflow:auto;position:relative;padding:.3rem 1rem 2rem}
.map-path{position:absolute;left:0;top:0;pointer-events:none}
.map-path path{fill:none;stroke:var(--ink-2);stroke-width:3.5;stroke-dasharray:1 12;stroke-linecap:round}
.map-head{display:flex;justify-content:center;margin:.2rem 0 .3rem}
.nodes{position:relative;display:flex;flex-direction:column;gap:1.2rem;padding:.6rem 0 1rem;width:100%;max-width:36rem;margin:0 auto}
.node{position:relative;align-self:flex-start;margin-left:5%;display:flex;align-items:center;gap:.8rem;background:none;border:0;padding:0;text-align:left;max-width:90%}
.node.r{align-self:flex-end;margin-left:0;margin-right:5%;flex-direction:row-reverse;text-align:right}
.disc{position:relative;width:5.3rem;height:5.3rem;flex:none;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center}
.disc > svg{width:78%;height:78%}
.node:active .disc{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.node.boss .disc{width:6.5rem;height:6.5rem;background:#FFF0EE}
.pg{position:absolute;top:-.55rem;left:-.45rem;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;font-family:var(--f-display);font-size:.85rem;padding:0 .4rem;line-height:1.45;transform:rotate(-6deg)}
.lbl{display:flex;flex-direction:column;gap:.1rem}
.lbl b{font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.15}
.lbl small{color:var(--ink-2);font-size:.85rem}
.stars{font-size:1.25rem;letter-spacing:.06em;color:#DCE1E8;-webkit-text-stroke:1.2px var(--ink);line-height:1}
.stars .on{color:var(--yellow)}
.node.locked .disc{background:#EEF1F5;box-shadow:0 5px 0 #9AA6B8;border-color:#9AA6B8}
.node.locked .disc > svg{filter:grayscale(1);opacity:.32}
.node.locked .lbl{opacity:.5}
.lock{position:absolute;right:-.35rem;bottom:-.35rem;width:1.8rem;height:1.8rem;background:#fff;border:2px solid #9AA6B8;border-radius:50%;display:grid;place-items:center}
.lock svg{width:1.05rem;height:1.05rem}
.here{position:absolute;width:2.9rem;height:3.25rem;top:-2.75rem;left:50%;margin-left:-.9rem;animation:bob 1.4s ease-in-out infinite;z-index:2}
.here svg{width:100%;height:100%}

/* 창 */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(34,48,74,.5);display:grid;place-items:center;padding:1rem;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(31rem,100%);max-height:calc(100dvh - 2rem);overflow:auto;background-color:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:1.2rem 1.1rem 1.15rem;animation:mpop .25s cubic-bezier(.3,1.5,.5,1);text-align:center;
  background-image:linear-gradient(var(--grid-soft) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid-soft) 1.5px,transparent 1.5px);background-size:1.6rem 1.6rem}
@keyframes mpop{from{transform:scale(.86);opacity:0}}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:.2rem 0 .5rem;line-height:1.25}
.modal p{margin:.45rem 0}
.mbtns{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1.1rem}
.guide{text-align:left;margin:.4rem 0 0;padding-left:1.4rem;font-size:1.05rem}
.guide li{margin:.35rem 0}
.intro-art{width:6.5rem;margin:0 auto}
.ilist{margin-top:.8rem;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:.45rem .75rem;text-align:left}
.ih{font-family:var(--f-hand);font-size:1.2rem;color:var(--ink-2)}
.il{display:flex;align-items:center;gap:.55rem;padding:.35rem 0;border-top:1.5px dashed var(--grid)}
.ih + .il{border-top:0}
.il .n{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem}
.il .t{flex:1;font-weight:700;font-size:1.15rem}
.toast{position:fixed;left:50%;top:.9rem;z-index:80;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--f-display);font-size:1rem;padding:.45rem 1.1rem;border-radius:99px;animation:toast 2.3s ease forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-4%;width:.55rem;height:.9rem;border-radius:2px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.stamp{width:7.2rem;height:7.2rem;margin:.1rem auto .5rem;border-radius:50%;border:4px solid var(--red);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:1.35rem;line-height:1.1;background:rgba(255,255,255,.55);transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .15s both}
@keyframes stamp{0%{transform:scale(2.3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.bigstars{font-size:2.6rem;letter-spacing:.1em;color:#DCE1E8;-webkit-text-stroke:2px var(--ink);line-height:1.1}
.bigstars .on{color:var(--yellow);display:inline-block;animation:starpop .45s cubic-bezier(.3,1.6,.5,1) .3s both}
.bigstars .on:nth-child(2){animation-delay:.45s}
.bigstars .on:nth-child(3){animation-delay:.6s}
@keyframes starpop{from{transform:scale(0)}}
.rew{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin-top:.6rem}
.big-score{font-family:var(--f-display);font-size:2rem;margin:.2rem 0}
.crown-note{font-size:1rem}

/* 전투 */
.battle{--sky1:#E3F8E8;--sky2:#C4EDCF;--ground:#93D69F}
.bhead{flex:none;display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem .3rem}
.btitle{flex:1;min-width:0;font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:.06rem;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.hrt{width:1.2rem;height:1.1rem}
.hrt path{fill:var(--red);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.hrt.empty path{fill:#fff}
.potion{flex:none;display:flex;align-items:center;gap:.15rem;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:.1rem .45rem;font-family:var(--f-display);font-size:1.05rem}
.potion:active{transform:translateY(3px);box-shadow:none}
.potion b{font-weight:400}
.scene{position:relative;flex:none;height:clamp(8.5rem,min(28vh,52vw),17rem);margin:0 .7rem;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.scene .dk{position:absolute;overflow:visible}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--ground);border-top:3px solid var(--ink)}
.fighter{position:absolute;bottom:8%;height:70%;aspect-ratio:100/112}
.fighter.hero{left:9%}
.fighter.mon{right:9%;height:68%;aspect-ratio:1}
.fighter.mon.boss{height:84%;right:6%}
.fighter .bob{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite}
.fighter.mon .bob{animation-duration:2.1s}
.fighter svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-5%)}}
.fighter.atk{animation:lunge .45s ease-out}
@keyframes lunge{35%{transform:translateX(55%)}}
.fighter.atk2{animation:lungeL .45s ease-out}
@keyframes lungeL{35%{transform:translateX(-45%)}}
.fighter.hit{animation:shake .45s}
.fighter.hurt{animation:shake .45s,redflash .45s}
@keyframes shake{20%{transform:translateX(7%)}40%{transform:translateX(-6%)}60%{transform:translateX(4%)}80%{transform:translateX(-2%)}}
@keyframes redflash{30%{filter:sepia(1) saturate(6) hue-rotate(-30deg)}}
.fighter.enter{animation:enter .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes enter{from{transform:translateX(60%) scale(.4);opacity:0}}
.fighter.down{animation:down .7s ease-in forwards}
@keyframes down{30%{transform:scale(1.1)}100%{transform:scale(.1) rotate(25deg);opacity:0}}
.fighter.angry .bob{animation-duration:.9s}
.fighter.angry svg{filter:saturate(1.35) brightness(.95)}
.tag{position:absolute;top:.4rem;background:rgba(255,255,255,.93);border:2px solid var(--ink);border-radius:10px;padding:.1rem .45rem;font-family:var(--f-display);font-size:.9rem;line-height:1.25;display:flex;flex-direction:column;gap:.1rem;max-width:48%;z-index:2}
.tag b{font-weight:400;color:var(--blue)}
.hero-tag{left:.45rem;flex-direction:row;gap:.3rem}
.mon-tag{right:.45rem;align-items:flex-end;text-align:right}
.mhp{display:flex;gap:.05rem}
.mhp .hrt{width:1rem;height:.95rem}
.hpbar{display:block;width:6.5rem;height:.7rem;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.herowrap{position:relative;width:100%;height:100%;container-type:inline-size}
.herowrap > svg{width:100%;height:100%}
.hat{position:absolute;left:50%;top:-2%;transform:translateX(-50%) rotate(-8deg);font-size:2rem;font-size:34cqw;line-height:1}
.pet{position:absolute;left:-32%;bottom:0;font-size:1.6rem;font-size:30cqw;line-height:1;animation:bob 1.8s ease-in-out infinite}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.fxi{position:absolute;width:5rem;height:5rem;margin:-2.5rem 0 0 -2.5rem;animation:fxpop .6s ease-out forwards}
.fxi.crit{width:7rem;height:7rem;margin:-3.5rem 0 0 -3.5rem}
@keyframes fxpop{0%{transform:scale(.3) rotate(-20deg);opacity:0}30%{opacity:1}100%{transform:scale(1.25) rotate(10deg);opacity:0}}
.pop{position:absolute;transform:translate(-50%,0);font-family:var(--f-display);font-size:1.5rem;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:popup .95s ease-out forwards;pointer-events:none;z-index:4}
.pop.bad{color:var(--red)}
.pop.crit{font-size:1.85rem;color:var(--yellow)}
.pop.heal{color:#5CC46E}
.pop.small{font-size:1.3rem}
@keyframes popup{0%{transform:translate(-50%,10px) scale(.6);opacity:0}25%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-40px);opacity:0}}

const DGROUP = [19, 7, 20, 22, 23, 25];
const DSCORE = { 19: 8, 7: 7, 20: 6, 22: 5, 23: 5, 25: 4 };
const GGROUP = [1, 2, 24];
const GSCORE = { 1: 8, 2: 6, 24: 4 };
const BGROUP = [17, 26];
const DOUBLE = { 3: [1, 19], 5: [4, 22], 6: [4], 9: [8, 1], 10: [8, 16], 11: [8, 17], 12: [8], 13: [8], 14: [8, 26], 15: [8], 18: [17] };
const VALT = { 1: [[5, 6]], 5: [[1, 6]], 3: [[7, 4]], 7: [[3, 4]], 10: [[11, 6], [15, 5]], 11: [[10, 6], [15, 5]], 15: [[11, 5], [10, 5]], 2: [[0, 5]], 6: [[4, 5]], 12: [[8, 4]], 17: [[13, 4]], 9: [[10, 3]], 14: [[15, 3]], 16: [[19, 3]], 19: [[20, 5], [18, 3]] };
const CALT = { 0: [1], 1: [0], 3: [4], 4: [3], 7: [8], 8: [7], 9: [10], 10: [9], 12: [13, 14], 13: [12], 14: [12], 15: [0], 16: [3], 17: [7] };

function applyOps(cs, ops) {
  const out = cs.slice(); const dd = {};
  ops.forEach((o) => {
    const b = dd[o.i] || dec(out[o.i]);
    if (o.c !== undefined) b[0] = o.c;
    if (o.v !== undefined) b[1] = o.v;
    if (o.j !== undefined) b[2] = o.j;
    dd[o.i] = b;
  });
  Object.keys(dd).forEach((k) => { out[k] = com(dd[k][0], dd[k][1], dd[k][2]); });
  return out;
}

/* i번째 글자에서 생길 수 있는 '받아쓰기 실수'들 (소리대로 쓰기, 받침·모음 헷갈림 …) */
function editsAt(cs, i) {
  const out = []; const ch = cs[i];
  if (!isH(ch)) return out;
  const d = dec(ch); const c = d[0], v = d[1], jg = d[2];
  const nx = isH(cs[i + 1]) ? dec(cs[i + 1]) : null;
  const E = (ops, sc, rule) => out.push({ ops, sc, rule });
  if (jg && nx) {
    const nc = nx[0], nv = nx[1];
    if (nc === 11) {
      if ((jg === 7 || jg === 25) && nv === 20) E([{ i, j: 0 }, { i: i + 1, c: jg === 7 ? 12 : 14 }], 9, 'sound');
      else if (jg === 27) E([{ i, j: 0 }], 8, 'sound');
      else if (LIAISON[jg]) E([{ i, j: LIAISON[jg][0] }, { i: i + 1, c: LIAISON[jg][1] }], 10, 'sound');
    }
    if ((nc === 2 || nc === 6) && NASAL[jg] !== undefined) E([{ i, j: NASAL[jg] }], 9, 'sound');
    if (jg === 4 && nc === 5) E([{ i, j: 8 }], 8, 'sound');
    if ((jg === 8 || jg === 13 || jg === 15) && nc === 2) E([{ i: i + 1, c: 5 }], 9, 'sound');
    if ((jg === 16 || jg === 21) && nc === 5) E([{ i: i + 1, c: 2 }], 7, 'sound');
    if (TENSE[nc] !== undefined) {
      if (OBS.has(jg)) E([{ i: i + 1, c: TENSE[nc] }], 8, 'sound');
      else if (jg === 4 || jg === 16 || jg === 5 || jg === 10) E([{ i: i + 1, c: TENSE[nc] }], 4, 'sound');
    }
    if ((jg === 27 || jg === 6 || jg === 15) && ASP_N[nc] !== undefined) E([{ i, j: { 27: 0, 6: 4, 15: 8 }[jg] }, { i: i + 1, c: ASP_N[nc] }], 9, 'sound');
    if (nc === 18 && ASP_J[jg] !== undefined) E([{ i, j: 0 }, { i: i + 1, c: ASP_J[jg] }], 9, 'sound');
    if (nc === 18 && (jg === 4 || jg === 8 || jg === 16)) E([{ i, j: 0 }, { i: i + 1, c: { 4: 2, 8: 5, 16: 6 }[jg] }], 7, 'sound');
  }
  if (jg && !(nx && nx[0] === 11)) {
    if (DGROUP.indexOf(jg) >= 0 || jg === 27) DGROUP.forEach((a) => { if (a !== jg) E([{ i, j: a }], DSCORE[a], 'jong'); });
    if (GGROUP.indexOf(jg) >= 0) GGROUP.forEach((a) => { if (a !== jg) E([{ i, j: a }], GSCORE[a], 'jong'); });
    if (BGROUP.indexOf(jg) >= 0) BGROUP.forEach((a) => { if (a !== jg) E([{ i, j: a }], 7, 'jong'); });
  }
  if (DOUBLE[jg]) DOUBLE[jg].forEach((a) => E([{ i, j: a }], 8, 'jong'));
  if (v === 6 && (c === 12 || c === 13 || c === 14)) E([{ i, v: 4 }], 9, 'vowel');
  else if (VALT[v]) VALT[v].forEach((p) => E([{ i, v: p[0] }], p[1], 'vowel'));
  if (CALT[c]) CALT[c].forEach((a) => E([{ i, c: a }], 3, 'cons'));
  return out;
}

function holeCands(cs, i) {
  const m = new Map();
  const consider = (e) => {
    if (!e.ops.some((o) => o.i === i)) return;
    const ch = applyOps(cs, e.ops)[i];
    if (ch === cs[i]) return;
    if ((m.get(ch) || 0) < e.sc) m.set(ch, e.sc);
  };
  editsAt(cs, i).forEach(consider);
  if (i > 0) editsAt(cs, i - 1).forEach(consider);
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
}

function wordVariants(cs, w, prevW) {
  const res = new Map(); const orig = cs.slice(w.s, w.e).join('');
  const add = (arr, sc, rule, pos) => {
    const v = arr.slice(w.s, w.e).join('');
    if (v === orig) return;
    const old = res.get(v);
    if (!old || old.sc < sc) res.set(v, { v, sc, rule, pos });
  };
  const soundEdits = [];
  for (let i = w.s; i < w.e; i++) {
    editsAt(cs, i).forEach((e) => {
      if (!e.ops.every((o) => o.i >= w.s && o.i < w.e)) return;
      add(applyOps(cs, e.ops), e.sc, e.rule, i);
      if (e.rule === 'sound' && e.sc >= 4) soundEdits.push(e);
    });
  }
  if (soundEdits.length >= 2) { // 소리 나는 대로 모두 쓴 낱말 (줄넘기 → 줄럼끼)
    const used = {}; const ops = []; let top = 0;
    soundEdits.slice().sort((a, b) => b.sc - a.sc).forEach((e) => {
      const clash = e.ops.some((o) => ['c', 'v', 'j'].some((p) => o[p] !== undefined && used[o.i + p] !== undefined && used[o.i + p] !== o[p]));
      if (clash) return;
      e.ops.forEach((o) => ['c', 'v', 'j'].forEach((p) => { if (o[p] !== undefined) used[o.i + p] = o[p]; }));
      e.ops.forEach((o) => ops.push(o)); top = Math.max(top, e.sc);
    });
    if (ops.length) add(applyOps(cs, ops), top + 1, 'sound', w.s);
  }
  if (prevW && jongOf(prevW.w) === 8 && isH(cs[w.s]) && /^(거|것|수|데|줄)/.test(orig)) { // 자랄 거야 → 꺼야
    const c0 = dec(cs[w.s])[0];
    if (TENSE[c0] !== undefined) add(applyOps(cs, [{ i: w.s, c: TENSE[c0] }]), 8, 'sound', w.s);
  }
  if (w.e - w.s >= 2) {
    const last = cs[w.e - 1];
    if (last === '를' || last === '을') { const arr = cs.slice(); arr[w.e - 1] = last === '를' ? '을' : '를'; add(arr, 4, 'josa', w.e - 1); }
  }
  if (res.size < 2) {
    for (let i = w.s; i < w.e; i++) if (isH(cs[i]) && dec(cs[i])[2]) add(applyOps(cs, [{ i, j: 0 }]), 2, 'jong', i);
  }
  return Array.from(res.values()).sort((a, b) => b.sc - a.sc || a.pos - b.pos);
}

function sentenceVariants(cs, words) {
  const res = new Map(); const orig = cs.join('');
  const add = (text, sc, rule, slot) => {
    if (text === orig) return;
    const o = res.get(text);
    if (!o || o.sc < sc) res.set(text, { text, sc, rule, slot });
  };
  words.forEach((w, k) => {
    wordVariants(cs, w, words[k - 1]).forEach((x) => add(cs.slice(0, w.s).join('') + x.v + cs.slice(w.e).join(''), x.sc, x.rule, 'w' + k));
  });
  for (let k = 0; k < words.length - 1; k++) {
    const a = words[k], b = words[k + 1];
    if (cs.slice(a.e, b.s).join('') !== ' ') continue;
    const joined = cs.slice(0, a.e).join('') + cs.slice(b.s).join('');
    if (Array.from(a.w).length >= 2 && /(를|을|에|에서|에게|와|과|도|의|로|으로|한테|께)$/.test(a.w)) add(joined, 6, 'space', 'space');
    else if (/^(거|것|수|데|줄|때|적|뿐|만큼)/.test(b.w) && (jongOf(a.w) === 8 || /[는은던]$/.test(a.w))) add(joined, 8, 'space', 'space');
  }
  words.forEach((w) => {
    const k = w.w.indexOf('거리');
    if (k >= 2) { const at = w.s + k; add(cs.slice(0, at).join('') + ' ' + cs.slice(at).join(''), 7, 'space', 'space'); }
  });
  return Array.from(res.values()).sort((a, b) => b.sc - a.sc);
}

function pickVariants(list, n) {
  const out = []; const slots = new Set();
  list.forEach((x) => { if (out.length < n && x.sc >= 5 && !slots.has(x.slot)) { out.push(x); slots.add(x.slot); } });
  list.forEach((x) => { if (out.length < n && out.indexOf(x) < 0) out.push(x); });
  return out;
}

function splitWords(text) {
  const cs = Array.from(text); const res = []; let i = 0;
  const isWordCh = (ch) => isH(ch) || /[0-9A-Za-z]/.test(ch);
  while (i < cs.length) {
    if (cs[i] === ' ') { i++; continue; }
    let s = i;
    while (i < cs.length && cs[i] !== ' ') i++;
    let e = i;
    while (e > s && !isWordCh(cs[e - 1])) e--;
    while (s < e && !isWordCh(cs[s])) s++;
    if (e > s) res.push({ s, e, w: cs.slice(s, e).join('') });
  }
  return res;
}

function changedWord(right, wrong) {
  const strip = (s) => s.replace(/^[^가-힣0-9A-Za-z]+|[^가-힣0-9A-Za-z]+$/g, '');
  const rw = right.split(' '), ww = wrong.split(' ');
  if (rw.length === ww.length) {
    for (let k = 0; k < rw.length; k++) if (rw[k] !== ww[k]) return [strip(ww[k]), strip(rw[k])];
  }
  let a = 0;
  while (a < rw.length && a < ww.length && rw[a] === ww[a]) a++;
  let b = 0;
  while (b < rw.length - a && b < ww.length - a && rw[rw.length - 1 - b] === ww[ww.length - 1 - b]) b++;
  return [strip(ww.slice(a, ww.length - b).join(' ')), strip(rw.slice(a, rw.length - b).join(' '))];
}

function monsterStem(ww, rw) {
  const raw = String(ww || '');
  if (/\s/.test(raw)) return Array.from(raw.split(/\s+/)[0]).slice(0, 4).join('') || '오타';
  const a = Array.from(raw), b = Array.from(String(rw || '').replace(/\s+/g, ''));
  if (!a.length) return '오타';
  if (a.length <= 4) return a.join('');
  let idx = 0;
  while (idx < a.length && idx < b.length && a[idx] === b[idx]) idx++;
  if (idx >= a.length) idx = a.length - 1;
  const start = Math.max(0, Math.min(idx - 2, a.length - 3));
  return a.slice(start, start + 3).join('');
}

function makeTip(rule, ww, rw) {
  if (rule === 'sound') return `[${ww}]처럼 소리 나도 ‘${rw}’${ro(rw)} 써요.`;
  if (rule === 'space') return `띄어쓰기를 잘 봐요. ‘${rw}’처럼 써요.`;
  if (rule === 'josa') return `‘을’과 ‘를’을 잘 골라요. 바른 글자는 ‘${rw}’${ida(rw)}.`;
  if (rule === 'vowel') return `모음을 잘 봐요. 바른 글자는 ‘${rw}’${ida(rw)}.`;
  if (rule === 'jong') return `받침을 잘 봐요. 바른 글자는 ‘${rw}’${ida(rw)}.`;
  return `바른 글자는 ‘${rw}’${ida(rw)}.`;
}

/* 선생님이 넣은 새 문장 → 문제 자동 만들기 */
function autoItem(rawMain, wrongs) {
  const main = String(rawMain).replace(/\s+/g, ' ').trim();
  const marks = new Set(); let text = ''; let inB = false; let n = 0;
  for (const ch of main) {
    if (ch === '[') { inB = true; continue; }
    if (ch === ']') { inB = false; continue; }
    if (inB && ch !== ' ') marks.add(n);
    text += ch; n++;
  }
  if (/^\s/.test(text)) { const shift = text.length - text.replace(/^\s+/, '').length; const m2 = new Set(); marks.forEach((m) => m2.add(m - shift)); marks.clear(); m2.forEach((m) => marks.add(m)); }
  text = text.trim();
  const cs = Array.from(text);
  if (cs.filter(isH).length < 2) return null;
  const words = splitWords(text);
  const marked = (s, e) => { for (const m of marks) if (m >= s && m < e) return true; return false; };

  const ps = [];
  cs.forEach((ch, i) => {
    if (!isH(ch)) return;
    const cands = holeCands(cs, i).filter((x) => x[1] >= 4);
    if (!cands.length) return;
    ps.push({ i, cands, sc: cands[0][1] + (dec(ch)[2] ? 1 : 0) + (marks.has(i) ? 20 : 0) + Math.min(cands.length - 1, 2) * 0.5 });
  });
  ps.sort((a, b) => b.sc - a.sc || a.i - b.i);
  let holes = ps.slice(0, 1);
  const second = ps.find((p, k) => k > 0 && (p.sc >= 8 || marks.has(p.i)));
  if (holes.length && second) holes.push(second);
  if (!holes.length) {
    const any = [];
    cs.forEach((ch, i) => { if (!isH(ch)) return; const cands = holeCands(cs, i); if (cands.length) any.push({ i, cands, sc: cands[0][1] }); });
    any.sort((a, b) => b.sc - a.sc || a.i - b.i);
    holes = any.slice(0, 1);
  }
  holes.sort((a, b) => a.i - b.i);
  const pool = holes.map((h) => cs[h.i]);
  holes.forEach((h) => h.cands.slice(0, holes.length > 1 ? 2 : 3).forEach((x) => { if (pool.indexOf(x[0]) < 0) pool.push(x[0]); }));
  const A = holes.length ? { holes: holes.map((h) => h.i), pool } : null;

  const wv = words.map((w, k) => ({ w, vars: wordVariants(cs, w, words[k - 1]) })).filter((x) => x.vars.length);
  wv.forEach((x) => { x.sc = x.vars[0].sc + (x.w.e - x.w.s >= 2 ? 1 : 0) + (marked(x.w.s, x.w.e) ? 20 : 0); });
  const order = wv.slice().sort((a, b) => b.sc - a.sc || a.w.s - b.w.s);
  const chosen = order.slice(0, 1);
  if (order[1] && words.length >= 2 && (order[1].sc >= 7 || marked(order[1].w.s, order[1].w.e))) chosen.push(order[1]);
  chosen.sort((a, b) => a.w.s - b.w.s);
  const B = { codes: chosen.map((x) => ({ s: x.w.s, e: x.w.e, word: x.w.w, cards: [x.w.w].concat(pickVariants(x.vars.map((v) => ({ text: v.v, sc: v.sc, slot: 'p' + v.pos })), 2).map((v) => v.text)) })) };

  const own = (wrongs || []).map((s) => String(s).replace(/\s+/g, ' ').trim()).filter((s) => s && s !== text).slice(0, 3);
  const sv = sentenceVariants(cs, words).filter((x) => own.indexOf(x.text) < 0);
  const autoW = pickVariants(sv, 3 - own.length);
  const C = { wrong: own.concat(autoW.map((x) => x.text)) };

  if (!A && !B.codes.length && !C.wrong.length) return null;
  let stem = '오타', pair = [text, text], tip = '바르게 쓴 문장을 잘 기억해요!';
  const ref = own[0] || (autoW[0] && autoW[0].text);
  if (ref) {
    const cw = changedWord(text, ref);
    if (cw[0] && cw[1]) {
      pair = cw; stem = monsterStem(cw[0], cw[1]);
      tip = own[0] ? `바르게 쓰면 ‘${cw[1]}’${ida(cw[1])}.` : makeTip(autoW[0].rule, cw[0], cw[1]);
    }
  }
  return { text, cs, stem, pair, tip, A, B, C, auto: true };
}

function penMark(target, kind) {

  svg.setAttribute('width', w.toFixed(1)); svg.setAttribute('height', h.toFixed(1)); svg.setAttribute('aria-hidden', 'true');
  svg.style.left = -padX + 'px'; svg.style.top = -padY + 'px';

    const a0 = -2.25, a1 = a0 + Math.PI * 2 + 0.55;
    for (let k = 0; k <= 52; k++) { const a = a0 + ((a1 - a0) * k) / 52; const wob = 1 + 0.025 * Math.sin(a * 3) - (k / 52) * 0.07; pts.push((cx + Math.cos(a) * rx * wob).toFixed(1) + ' ' + (cy + Math.sin(a) * ry * wob).toFixed(1)); }
    d = 'M' + pts.join(' L');
  } else {
    d = `M${(w * 0.1).toFixed(1)} ${(h * 0.86).toFixed(1)} L${(w * 0.9).toFixed(1)} ${(h * 0.14).toFixed(1)}`;
  }

  if (RM) return;

}

const BOOK_COLORS = ['#4FB3E0', '#F0789B', '#FFD23F', '#5CC46E', '#A274DE', '#F2A33A', '#E4473E'];
const BOOK_LABELS = ['국어', '수학', '통합', '받아쓰기', '그림책', '동화책', '일기장'];
screens.stack = () => {
  root.innerHTML = `<div class="screen mini">${miniHead('책 쌓기', '<span class="pill">쌓은 책 <b id="sScore">0</b>권</span>')}
    <p class="mhint">움직이는 책이 아래 책 위에 오면 화면을 콕!</p>
    <div class="sbox" id="sbox" role="button" aria-label="책 놓기"><div class="sworld" id="sworld"></div></div>
  </div>`;
  const box = $('#sbox'); const Wd = box.clientWidth, Ht = box.clientHeight;
  const S = { W: Wd, H: Ht, bh: Math.max(22, Math.round(Ht / 13)), blocks: [], cur: null, dir: 1, speed: Wd * 0.42, over: false, raf: 0, last: 0, score: 0 };
  const world = $('#sworld');
  const bookEl = (x, w, lvl, color) => {
    const el = document.createElement('div'); el.className = 'book';
    el.style.cssText = `left:${x}px;bottom:${lvl * S.bh}px;width:${w}px;height:${S.bh}px;background:${color}`;
    if (w > 70) el.textContent = BOOK_LABELS[lvl % BOOK_LABELS.length];
    world.appendChild(el); return el;
  };
  const addBook = (x, w, lvl) => { const color = BOOK_COLORS[lvl % BOOK_COLORS.length]; S.blocks.push({ x, w, lvl, el: bookEl(x, w, lvl, color) }); };
  const cam = (lvl) => { const off = Math.max(0, (lvl + 2) * S.bh - S.H * 0.62); world.style.transform = `translateY(${off}px)`; };
  const newMover = () => {
    const below = S.blocks[S.blocks.length - 1]; const lvl = below.lvl + 1; const w = below.w;
    const x = S.dir > 0 ? -w * 0.3 : S.W - w * 0.7;
    S.cur = { x, w, lvl, el: bookEl(x, w, lvl, BOOK_COLORS[lvl % BOOK_COLORS.length]) }; cam(lvl);
  };
  const baseW = Math.round(S.W * 0.56);
  addBook(Math.round((S.W - baseW) / 2), baseW, 0);
  newMover();
  const place = () => {
    if (S.over || !S.cur) return;
    const m = S.cur, below = S.blocks[S.blocks.length - 1];
    const L = Math.max(m.x, below.x), R = Math.min(m.x + m.w, below.x + below.w);
    if (R - L <= 3) {
      S.over = true; cancelAnimationFrame(S.raf); m.el.classList.add('fall'); SFX.ouch();
      setTimeout(() => { if (CUR === 'stack') miniResult('책 쌓기', `${S.score}권을 쌓았어요!`, Math.min(60, S.score * 3), 'stack'); }, 900);
      return;
    }
    let x = L, w = R - L;
    if (Math.abs(m.x - below.x) <= Math.max(3, S.W * 0.012)) { x = below.x; w = below.w; SFX.coin(); floatText(box, '딱 맞아요!'); }
    else {
      SFX.tap();
      const cutX = m.x < below.x ? m.x : R; const cutW = m.w - w;
      if (cutW > 1) { const c = bookEl(cutX, cutW, m.lvl, BOOK_COLORS[m.lvl % BOOK_COLORS.length]); c.textContent = ''; c.classList.add('cut'); setTimeout(() => c.remove(), 850); }
    }
    m.el.remove(); addBook(x, w, m.lvl);
    S.score++; $('#sScore').textContent = S.score;
    S.speed = Math.min(S.W * 1.3, S.speed * 1.06);
    newMover();
  };
  box.addEventListener('pointerdown', (e) => { e.preventDefault(); place(); });
  box.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); place(); } });
  box.tabIndex = 0;
  const loop = (ts) => {
    if (S.over) return;
    const dt = Math.min(0.05, (ts - (S.last || ts)) / 1000); S.last = ts;
    const m = S.cur; m.x += S.dir * S.speed * dt;
    const minX = -m.w * 0.35, maxX = S.W - m.w * 0.65;
    if (m.x < minX) { m.x = minX; S.dir = 1; }
    if (m.x > maxX) { m.x = maxX; S.dir = -1; }
    m.el.style.left = m.x + 'px';
    S.raf = requestAnimationFrame(loop);
  };
  S.raf = requestAnimationFrame(loop);
  cleanup = () => { S.over = true; cancelAnimationFrame(S.raf); };
  setActions({ mquit: () => go('play') });
};

    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    return Promise.resolve(window.claude.use('artifact')).then((x) => x || null, () => null);
  } catch (e) { return Promise.resolve(null); }
}
function previewHTML(lines) {
  const items = buildItems(lines);
  const skipped = lines.filter((l) => { const en = lineToEntry(l); return !en || !entryToItem(en); });
  const skipNote = skipped.length ? `<p class="tnote">헷갈리는 글자가 없어 문제를 만들 수 없는 문장은 빠져요: <b>${skipped.map(esc).join(', ')}</b></p>` : '';
  if (!items.length) return skipNote + '<p class="tnote">문제를 만들 수 있는 문장이 없어요.</p>';
  const rows = items.map((it, n) => {
    const a = it.A ? `${esc(it.cs.map((ch, k) => (it.A.holes.indexOf(k) >= 0 ? '□' : ch)).join(''))}<br><small>${esc(it.A.pool.join(' · '))}</small>` : '-';
    const b = it.B && it.B.codes.length ? it.B.codes.map((c) => `${esc(Array.from(c.word).map(choOf).join(''))} → ${esc(c.cards.join(' / '))}`).join('<br>') : '-';
    const c = it.C.wrong.length ? it.C.wrong.map(esc).join('<br>') : '-';
    return `<tr><td>${n + 1}</td><td><b>${esc(it.text)}</b><br><small>몬스터: ${esc(it.stem)}</small></td><td>${a}</td><td>${b}</td><td>${c}</td></tr>`;
  }).join('');
  const long = items.some((it) => it.cs.length > 16) ? '<p class="tnote">16칸이 넘는 문장은 화면에서 글자 칸이 작아져요.</p>' : '';
  return `${skipNote}${long}<table><thead><tr><th>#</th><th>문장</th><th>구멍 메우기</th><th>초성 암호</th><th>진짜 문장 찾기 (틀린 문장)</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function segBtns(key, opts, cur) {
  return opts.map((o) => `<button class="${o[0] === cur ? 'on' : ''}" data-act="tOpt" data-k="${key}" data-v='${JSON.stringify(o[0])}' aria-pressed="${o[0] === cur}">${o[1]}</button>`).join('');
}
screens.teacher = () => {
  const text = (currentLines() || DEFAULT_LINES).join('\n');
  const src = SET.custom ? '이 기기에서 바꾼 문장' : EMBED ? '선생님이 게시한 문장' : '처음 문장 (사진 속 1~10번)';
  const ttsState = TTS.ok ? (TTS.hasKo === false ? '한국어 목소리를 찾지 못했어요' : '쓸 수 있어요') : '이 기기에서는 쓸 수 없어요';
  root.innerHTML = `<div class="screen">${miniHead('선생님 메뉴', '')}<div class="scroll"><div class="t-wrap">
    <section class="tsec">
      <h3>받아쓰기 문장</h3>
      <p class="tnote">지금 쓰는 문장: <b>${src}</b><br>한 줄에 한 문장씩 2~20개를 써 주세요. 세 가지 문제(구멍 메우기·초성 암호·진짜 문장 찾기)는 자동으로 만들어져요.<br><code>[바랬다]</code>처럼 대괄호로 감싼 낱말이 구멍·초성 문제에 먼저 나와요. 틀린 문장을 직접 정하려면 <code>|</code> 뒤에 써요. 예) <code>높이 자랄 거야. | 노피 자랄 거야.</code></p>
      <textarea class="tarea" id="tLines" spellcheck="false" aria-label="받아쓰기 문장 (한 줄에 한 문장)">${esc(text)}</textarea>
      <div class="trow"><button class="btn white" data-act="tPrev">문제 미리 보기</button><button class="btn white" data-act="tDefault">처음 문장 넣기</button></div>
      <div class="tprev" id="tPrevBox"></div>
      <div class="trow"><button class="btn" data-act="tLocal">이 기기에 적용</button><button class="btn red" data-act="tPublish" id="tPub" disabled>모든 학생 화면에 게시</button></div>
      <p class="tnote" id="tPubNote">‘이 기기에 적용’은 지금 이 브라우저에만 바뀌어요. 게시할 수 있는지 확인하고 있어요…</p>
    </section>
    <section class="tsec"><h3>게임 설정</h3>
      <div class="opt-row"><span>효과음</span><div class="seg">${segBtns('sfx', [[true, '켜기'], [false, '끄기']], SET.sfx !== false)}</div></div>
      <div class="opt-row"><span>읽어 주기 속도</span><div class="seg">${segBtns('rate', [[0.65, '느리게'], [0.8, '보통'], [1, '빠르게']], SET.rate)}</div></div>
      <div class="opt-row"><span>놀이터(미니게임)</span><div class="seg">${segBtns('play', [[true, '열기'], [false, '닫기']], SET.play !== false)}</div></div>
      <div class="opt-row"><span>소리 읽기</span><span class="tnote" style="margin:0">${ttsState}</span></div>
    </section>
    <section class="tsec"><h3>이 기기 기록</h3><p class="tnote">학생이 바뀔 때 이 기기의 진행 기록(레벨, 코인, 별, 도감)을 지워요. 문장과 설정은 그대로예요.</p><button class="btn red" data-act="tReset">진행 기록 지우기</button></section>
  </div></div></div>`;
  let cap = null;
  getArtifactCap().then((c) => {
    cap = c; const b = $('#tPub'), n = $('#tPubNote'); if (!b || CUR !== 'teacher') return;
    if (c) { b.disabled = false; n.textContent = '‘이 기기에 적용’은 이 브라우저에만, ‘모든 학생 화면에 게시’는 이 게임 링크로 들어오는 모든 학생에게 바뀌어요.'; }
    else n.textContent = '‘이 기기에 적용’은 지금 이 브라우저에만 바뀌어요. 모든 학생에게 바꾸려면 이 게임을 만든 선생님 계정으로 claude.ai에서 게임을 열어 주세요.';
  });
  const lines = () => parseLines($('#tLines').value);
  setActions({
    mquit: () => go(save ? 'map' : 'title'),
    tPrev: () => { const L = lines(); $('#tPrevBox').innerHTML = L.length < 2 ? '<p class="tnote">문장을 2개 이상 써 주세요.</p>' : previewHTML(L); },
    tDefault: () => { $('#tLines').value = DEFAULT_LINES.join('\n'); $('#tPrevBox').innerHTML = ''; toast('처음 문장을 넣었어요. ‘적용’을 눌러야 바뀌어요.'); },
    tLocal: async () => {
      const L = lines(); if (L.length < 2) { toast('문장을 2개 이상 써 주세요'); return; }
      const ok = await modal({ html: '<h2>이 기기에 적용할까요?</h2><p>문장이 바뀌면 이 기기의 별과 도감은 처음부터 시작해요.<br>(레벨, 코인, 아이템은 그대로예요)</p>', buttons: [{ label: '적용하기', value: true }, { label: '그만두기', value: false, cls: 'white' }] });
      if (!ok) return;
      SET.custom = isDefaultLines(L) && !EMBED ? null : L; persistSettings(); rebuildGame();
      toast(`문장 ${GAME.items.length}개로 바꿨어요!`); go(save ? 'map' : 'title');
    },
    tPublish: async () => {
      if (!cap) return;
      const L = lines(); if (L.length < 2) { toast('문장을 2개 이상 써 주세요'); return; }
      const ok = await modal({ html: `<h2>모든 학생 화면에 게시할까요?</h2><p>이 게임 링크로 들어오는 모든 학생이 새 문장 ${L.length}개로 공부해요.<br>학생들의 별과 도감은 처음부터 시작해요.</p>`, buttons: [{ label: '게시하기', value: true, cls: 'red' }, { label: '그만두기', value: false, cls: 'white' }] });
      if (!ok) return;
      const btn = $('#tPub'); if (btn) btn.disabled = true;
      try {
        await cap.publish(buildDocument(isDefaultLines(L) ? null : { v: 1, lines: L }));
        SET.custom = null; persistSettings();
        toast('게시했어요! 잠시 뒤 새 문장으로 바뀌어요.');
      } catch (e) {
        if (btn) btn.disabled = false;
        const code = String((e && (e.code || e.name || e.message)) || e || '');
        let msg = '게시하지 못했어요. 잠시 뒤 다시 해 주세요.';
        if (/not_granted|not_writer/.test(code)) msg = '게시 권한이 없어요. 이 게임을 만든 선생님 계정에서만 게시할 수 있어요.';
        else if (/conflict/.test(code)) msg = '그사이 게임이 바뀌었어요. 화면을 새로 연 뒤 다시 게시해 주세요.';
        modal({ html: `<h2>게시하지 못했어요</h2><p>${esc(msg)}</p>`, buttons: [{ label: '확인', value: 1 }] });
      }
    },
    tOpt: (el) => {
      const k = el.dataset.k; let v; try { v = JSON.parse(el.dataset.v); } catch (e) { return; }
      SET[k] = v; persistSettings();
      $$('button', el.parentElement).forEach((x) => { const on = x === el; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
      if (k === 'rate') TTS.speak('축구를 가르쳐 주었어.'); else SFX.tap();
    },
    tReset: async () => {
      const ok = await modal({ html: '<h2>진행 기록을 지울까요?</h2><p>이 기기의 용사, 레벨, 코인, 별, 도감이 모두 지워져요.</p>', buttons: [{ label: '지우기', value: true, cls: 'red' }, { label: '그만두기', value: false, cls: 'white' }] });
      if (!ok) return;
      lsDel(SAVE_KEY); save = null; toast('진행 기록을 지웠어요'); go('title');
    },
  });
};

/* ===== 16. 시작 ===== */
function boot(hot) {
  try {
    if (hot && hot.save && hot.save.v === 1 && hot.save.hero && !save) save = fixSave(hot.save);
    if (hot && hot.set && !lsGet(SET_KEY)) SET = Object.assign(loadSettings(), hot.set);
  } catch (e) { /* 무시 */ }
  rebuildGame();
  TTS.init();
  go('title');
}
try { const H0 = window.claude && window.claude.hot; if (H0 && typeof H0.snapshot === 'function') H0.snapshot(() => ({ save, set: SET })); } catch (e) { /* 무시 */ }
const HOT = window.claude && window.claude.hot;
if (HOT && typeof HOT.ready === 'function') HOT.ready(boot); else boot((HOT && HOT.data) || {});
})();
</script>
</body>
